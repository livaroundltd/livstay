name: Site is up to date

# GitHub Pages serves docs/ from main. This check fails if docs/ was not
# rebuilt after a change to site/ or spec/.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.10.3
      - run: python3 tools/build_site.py
      - run: git diff --exit-code -- docs || (echo "docs/ is stale; run python3 tools/build_site.py and commit" && exit 1)
